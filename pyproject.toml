[project]
name = "ktrws"
version = "0.1.0"
description = "Joint Khmer text recognition and word segmentation (KTRWS)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fonttools>=4.64.0",
    "khmercut>=0.2.0",
    "numpy>=2.5.2",
    "onnxruntime>=1.29.0",
    "pillow>=12.3.0",
    "torch>=2.13.0",
    "tqdm>=4.70.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ktrws"]

[tool.ruff]
indent-width = 2
line-length = 110
